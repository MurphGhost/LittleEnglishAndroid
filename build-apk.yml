name: Build Android Debug APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库文件
        uses: actions/checkout@v4

      - name: 自动解压项目zip包
        run: |
          unzip LittleEnglishAndroid-Cloud*.zip -d ./android_project
          ls ./android_project

      - name: 配置JDK17（安卓编译必需）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 编译Debug调试APK
        working-directory: ./android_project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传编译出来的APK作为产物
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk包
          path: ./android_project/app/build/outputs/apk/debug/*.apk
